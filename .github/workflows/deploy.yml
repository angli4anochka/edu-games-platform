name: Deploy

# Деплой монорепо uniplay-games (backend FastAPI simple_server.py + frontend Next.js) через self-hosted runner.
# Процессы управляются systemd (НЕ pm2): edu-games-backend / edu-games-frontend.
# На push в main: checkout -> rsync кода -> backend (pip install + systemctl restart)
#                 -> frontend (next build + systemctl restart).
# passwordless sudo для этих двух restart на VM настроен.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-edu
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, edu]
    steps:
      - uses: actions/checkout@v4

      - name: Sync, build & restart
        run: |
          set -euo pipefail
          APP_DIR="/var/www/edu-games"

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'venv' --exclude 'backend/venv' \
            --exclude '.env' --exclude '.env.*' \
            --exclude '*.db' --exclude '*.sqlite' \
            ./ "$APP_DIR/"

          # --- Backend (FastAPI simple_server.py, venv, systemd) ---
          cd "$APP_DIR/backend"
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart edu-games-backend

          # --- Frontend (Next.js :3002, systemd) ---
          cd "$APP_DIR/frontend"
          npm install
          npm run build
          sudo systemctl restart edu-games-frontend

          echo "✅ edu-games-platform deployed -> https://uniplay-games.ru"
